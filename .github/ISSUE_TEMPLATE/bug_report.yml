name: Bug report
description: Something in Shipwatch doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Use synthetic or redacted data only: never paste access tokens, Keychain contents or private repository details.
        Security issues go through the [private reporting form](https://github.com/mbianchidev/shipwatch/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings > Repositories
        2. Add octocat/hello-world
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shipwatch version
      description: Settings > General > Updates, or "dev" for a source build.
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.5, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: sign-in
    attributes:
      label: Sign-in method
      options:
        - Shipwatch GitHub App
        - GitHub CLI token
        - Not signed in
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        Optional. Collect with `log show --last 30m --predicate 'subsystem == "dev.mbianchi.shipwatch"'` and redact anything private.
      render: text
